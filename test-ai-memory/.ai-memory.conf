# ai-memory-storager Configuration
# Copy to project root as .ai-memory.conf and customize

# Vault location relative to project root
VAULT_PATH="./vault"

# Project identifier (used in folder names, tags)
PROJECT_NAME="test-ai-memory"

# Memory files location (relative to project root)
MEMORY_FILE="./MEMORY.md"
AGENTS_FILE="./AGENTS.md"

# Graphify settings
GRAPHIFY_ENABLED=true
GRAPHIFY_CMD="graphify"  # or "npx graphify", "python -m graphify", etc.

# Indexer settings
INDEXER_DIR="_indexers"
AUTO_REGENERATE_INDEXERS=true

# Compaction settings
COMPACTION_ENABLED=true
ARCHIVE_DIR="archive"

# Git integration
GIT_AUTO_STAGE=true

# Tagging scheme (hierarchical)
TAG_PROJECT_PREFIX="project"
TAG_DOMAIN_PREFIX="domain"
TAG_TYPE_PREFIX="type"
TAG_STATUS_PREFIX="status"

# Default domains
DOMAINS="backend frontend infra docs"

# Default types
TYPES="spec decision error learning"

# Default statuses
STATUSES="active completed archived"